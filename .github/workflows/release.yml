name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            name: x64
          - arch: '386'
            name: x86
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create bin directories
        run: |
          mkdir -p assets/bin/x64
          mkdir -p assets/bin/x86

      - name: Download and extract Wintun
        run: |
          curl -L -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip wintun.zip -d wintun_extracted
          cp wintun_extracted/wintun/bin/amd64/wintun.dll assets/bin/x64/wintun.dll
          cp wintun_extracted/wintun/bin/x86/wintun.dll assets/bin/x86/wintun.dll
          rm -rf wintun.zip wintun_extracted

      - name: Download and extract Mihomo cores
        run: |
          # Download x64 Mihomo (go120 version)
          curl -L -o mihomo_x64.zip https://github.com/MetaCubeX/mihomo/releases/download/v1.19.26/mihomo-windows-amd64-v1-go120-v1.19.26.zip
          unzip mihomo_x64.zip -d mihomo_x64_extracted
          mv mihomo_x64_extracted/*.exe assets/bin/x64/mihomo.exe
          
          # Download x86 Mihomo (go120 version)
          curl -L -o mihomo_x86.zip https://github.com/MetaCubeX/mihomo/releases/download/v1.19.26/mihomo-windows-386-go120-v1.19.26.zip
          unzip mihomo_x86.zip -d mihomo_x86_extracted
          mv mihomo_x86_extracted/*.exe assets/bin/x86/mihomo.exe
          
          rm -rf mihomo_x64.zip mihomo_x64_extracted mihomo_x86.zip mihomo_x86_extracted

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate resources
        run: go-winres make

      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -H windowsgui" -o TrayClash-${{ matrix.name }}.exe .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: TrayClash-${{ matrix.name }}.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
