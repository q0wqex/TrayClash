name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create bin directories
        run: |
          mkdir -p assets/bin/x86

      - name: Download and extract Wintun
        run: |
          curl -L -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip wintun.zip -d wintun_extracted
          cp wintun_extracted/wintun/bin/x86/wintun.dll assets/bin/x86/wintun.dll
          rm -rf wintun.zip wintun_extracted

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Build Moshen core
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: 0
        run: |
          git clone --depth=1 -b v1.19.30-smart-jesus-moshen https://github.com/legiz-ru/moshen.git moshen_src
          cd moshen_src
          # Fix Go 1.20 compatibility in muxcool
          sed -i 's|"context"|"context"\n\t"github.com/metacubex/mihomo/common/contextutils"|' transport/muxcool/server.go
          sed -i 's/context\.WithoutCancel/contextutils\.WithoutCancel/g' transport/muxcool/server.go
          git diff transport/muxcool/server.go
          go build -tags with_gvisor -trimpath -ldflags "-s -w -buildid= -X 'github.com/metacubex/mihomo/constant.Version=v1.19.30-smart-jesus-moshen'" -o "$GITHUB_WORKSPACE/assets/bin/x86/mihomo.exe" .
          cd ..
          rm -rf moshen_src

      - name: Install dependencies
        run: go mod download

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate resources
        run: go-winres make

      - name: Build
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -H windowsgui" -o TrayClash.exe .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: TrayClash.exe
          name: TrayClash ${{ github.ref_name }}
          body: |
            | | |
            |---|---|
            | Mihomo (Moshen) core | [`v1.19.30-smart-jesus-moshen`](https://github.com/legiz-ru/moshen/releases/tag/v1.19.30-smart-jesus-moshen) ([`legiz-ru/moshen`](https://github.com/legiz-ru/moshen)) |
            | Upstream | [`MetaCubeX/mihomo`](https://github.com/MetaCubeX/mihomo) + [@Jolymmiles](https://github.com/Jolymmiles) (Jesus) + [@legiz-ru](https://github.com/legiz-ru) |
            | Wintun | `0.14.1` (x86) |
            | Platform | Windows 7+ (`windows/386`, Go 1.20) |

            ### Что нового

            * **Ядро `v1.19.30-smart-jesus-moshen`**: актуальные доработки от Jolymmiles и legiz-ru, поддержка ML-DSA-65.
            * **Новое меню трея**: селектор вынесен наверх, отдельные подменю «Подписки» и «Настройки».
            * **Обновление подписок**: кнопка «Обновить подписку», а также обновление кликом по активному профилю.
            * **Автозагрузка**: единый пункт «Автозагрузка» с переключением статуса.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
