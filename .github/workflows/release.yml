name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create bin directories
        run: |
          mkdir -p assets/bin/x86

      - name: Download and extract Wintun
        run: |
          curl -L -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip wintun.zip -d wintun_extracted
          cp wintun_extracted/wintun/bin/x86/wintun.dll assets/bin/x86/wintun.dll
          rm -rf wintun.zip wintun_extracted

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Download and extract Mihomo (Prizrak) core
        run: |
          curl -L -o prizrak-core.zip https://github.com/legiz-ru/Prizrak-Core/releases/download/v1.19.31/prizrak-core-windows-386-go120-v1.19.31.zip
          unzip prizrak-core.zip -d prizrak_extracted
          cp prizrak_extracted/prizrak-core-windows-386-go120.exe assets/bin/x86/mihomo.exe
          rm -rf prizrak-core.zip prizrak_extracted

      - name: Install dependencies
        run: go mod download

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate resources
        run: go-winres make

      - name: Build
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -H windowsgui" -o TrayClash.exe .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: TrayClash.exe
          name: TrayClash ${{ github.ref_name }}
          body: |
            | | |
            |---|---|
            | Mihomo (Prizrak-Core) | [`v1.19.31`](https://github.com/legiz-ru/Prizrak-Core/releases/tag/v1.19.31) ([`legiz-ru/Prizrak-Core`](https://github.com/legiz-ru/Prizrak-Core)) |
            | Wintun | `0.14.1` (x86) |
            | Platform | Windows 7+ (`windows/386`, Go 1.20) |

            ### Что нового

            * **Поддержка кастомного ядра**: возможность использовать свое ядро `custom.exe` в папке с данными (`AppData/Roaming/TrayClash`) без затирания при старте.
            * **Обновление ядра**: переход на `v1.19.31` (Prizrak-Core / smart-jesus-moshen).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
